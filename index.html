<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник ДЗ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef0e4;--card:#fff;--ink:#1e2b26;--soft:#56635b;--line:#d9dccb;--accent:#2f6f62;--warn:#a8472b;--violet:#7d63a6}
@media(prefers-color-scheme:dark){:root{--bg:#141d19;--card:#212e29;--ink:#eae7dc;--soft:#a9b3ac;--line:#2b3833;--accent:#6fb39f;--warn:#d98363;--violet:#b7a3d9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:16px}
button,input{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.wrap{max-width:760px;margin:0 auto}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth{width:100%;max-width:360px}
h1{font-size:20px;margin:0 0 4px}
input.f{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;margin-top:8px}
.btn{background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;margin-top:12px;width:100%}
.btn.sec{background:transparent;color:var(--soft);font-weight:500}
.btn.violet{background:var(--violet)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:7px;background:var(--bg);font-size:13px}
.tabs button.on{background:var(--accent);color:#fff}
.rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rail button{padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px}
.rail button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar .u{font-size:13px;color:var(--soft)}
.task{margin-bottom:10px;border-left:4px solid var(--accent)}
.task .row{display:flex;gap:10px;align-items:flex-start}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.sub{font-size:12px;color:var(--accent);font-weight:600}
.meta{font-size:12px;color:var(--soft);margin-top:4px}
.who{font-size:12px;margin-top:6px;color:var(--soft)}
.err{color:var(--warn);font-size:13px;margin-top:8px}
.empty{text-align:center;padding:40px;color:var(--soft)}
.perm{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:40px;height:24px;border-radius:20px;background:var(--line);position:relative}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on::after{transform:translateX(16px)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
a.link{color:var(--accent);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div id="auth" class="center" style="display:none">
  <div class="card auth">
    <h1>✎ Дневник ДЗ</h1>
    <p style="color:var(--soft);font-size:13px;margin:0 0 14px">Личный кабинет для домашних заданий</p>
    <div class="tabs"><button id="tL" class="on">Вход</button><button id="tR">Регистрация</button></div>
    <div id="authForm"></div>
    <div id="authErr" class="err"></div>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="topbar">
    <h1>✎ Дневник ДЗ</h1>
    <div class="u" id="userChip"></div>
  </div>
  <div class="rail" id="rail"></div>
  <div id="board"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "sb_publishable_7bm_xi7Bwvcb-g6vZANSJQ_FL3m8q7R";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ29uZ2Vtc2V1eXpkdHdsY2x5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTQwNTUsImV4cCI6MjEwNTkzMDA1NX0.qHdVHaMJLjxElBHrb84Ic2liuW4NppgN8OfUvFvEgJ0";
const EMAIL_SUFFIX = "@hwapp.local";

let remember = localStorage.getItem("hw_remember") === "1";
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: remember ? window.localStorage : window.sessionStorage, persistSession: true }
});

let profile = null, view = { tab: "all", mode: "list", draft: {}, editingUser: null };

function toast(t){ const e=document.getElementById("toast"); e.textContent=t; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),2200); }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function norm(s){ return s.toLowerCase().replace(/ё/g,"е").trim().replace(/\s+/g," "); }

// ---------- AUTH SCREEN ----------
function renderAuthForm(mode){
  const f = document.getElementById("authForm");
  document.getElementById("tL").classList.toggle("on", mode==="login");
  document.getElementById("tR").classList.toggle("on", mode==="register");
  document.getElementById("authErr").textContent = "";
  if(mode==="login"){
    f.innerHTML = `
      <input class="f" id="loginInput" placeholder="Логин">
      <input class="f" id="passInput" type="password" placeholder="Пароль">
      <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--soft);margin-top:10px">
        <input type="checkbox" id="rememberChk"> Запомнить меня
      </label>
      <button class="btn" id="loginBtn">Войти</button>`;
    document.getElementById("loginBtn").onclick = doLogin;
  } else {
    f.innerHTML = `
      <input class="f" id="loginInput" placeholder="Логин">
      <input class="f" id="passInput" type="password" placeholder="Пароль">
      <input class="f" id="pass2Input" type="password" placeholder="Повтори пароль">
      <button class="btn" id="regBtn">Зарегистрироваться</button>`;
    document.getElementById("regBtn").onclick = doRegister;
  }
}
document.getElementById("tL").onclick = () => renderAuthForm("login");
document.getElementById("tR").onclick = () => renderAuthForm("register");

async function doLogin(){
  const login = document.getElementById("loginInput").value.trim();
  const pass = document.getElementById("passInput").value;
  const rem = document.getElementById("rememberChk").checked;
  if(!login || !pass) return;
  localStorage.setItem("hw_remember", rem ? "1" : "0");
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: rem ? window.localStorage : window.sessionStorage, persistSession: true }
  });
  const { error } = await sb.auth.signInWithPassword({ email: login.toLowerCase()+EMAIL_SUFFIX, password: pass });
  if(error){ document.getElementById("authErr").textContent = "Неверный логин или пароль"; return; }
  await boot();
}

async function doRegister(){
  const login = document.getElementById("loginInput").value.trim();
  const pass = document.getElementById("passInput").value;
  const pass2 = document.getElementById("pass2Input").value;
  const err = document.getElementById("authErr");
  if(!login || login.length < 3) return err.textContent = "Логин от 3 символов";
  if(pass.length < 6) return err.textContent = "Пароль от 6 символов";
  if(pass !== pass2) return err.textContent = "Пароли не совпадают";
  const { error } = await sb.auth.signUp({
    email: login.toLowerCase()+EMAIL_SUFFIX, password: pass,
    options: { data: { login } }
  });
  if(error){ err.textContent = error.message.includes("registered") ? "Такой логин уже занят" : error.message; return; }
  toast("Аккаунт создан, входим…");
  await doLoginAfterRegister(login, pass);
}
async function doLoginAfterRegister(login, pass){
  const { error } = await sb.auth.signInWithPassword({ email: login.toLowerCase()+EMAIL_SUFFIX, password: pass });
  if(!error) await boot();
}

document.getElementById("logoutBtnPH");
async function logout(){ await sb.auth.signOut(); location.reload(); }

// ---------- BOOT ----------
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ document.getElementById("auth").style.display="flex"; document.getElementById("app").style.display="none"; renderAuthForm("login"); return; }
  const { data:p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if(error || !p){ await sb.auth.signOut(); document.getElementById("auth").style.display="flex"; renderAuthForm("login"); return; }
  if(p.is_blocked){ toast("Аккаунт заблокирован администратором"); await sb.auth.signOut(); document.getElementById("auth").style.display="flex"; renderAuthForm("login"); return; }
  profile = p;
  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";
  renderApp();
}

// ---------- APP SHELL ----------
function renderApp(){
  document.getElementById("userChip").innerHTML =
    `${esc(profile.display_name||profile.login)}${profile.is_admin?' · 👑 админ':''} · <a class="link" onclick="logout()">выйти</a>`;
  renderRail();
  renderBoard();
}

function renderRail(){
  const r = document.getElementById("rail");
  let html = "";
  if(profile.can_add || profile.is_admin) html += `<button class="btn violet" style="width:auto" onclick="startAdd()">＋ Записать ДЗ</button>`;
  if(profile.is_admin) html += `<button onclick="openRights()">👑 Права</button>`;
  if(profile.can_view || profile.is_admin){
    html += `<button class="${view.tab==='all'&&view.mode==='list'?'on':''}" onclick="setTab('all')">Все ДЗ</button>`;
    html += `<button class="${view.tab==='history'?'on':''}" onclick="setTab('history')">История</button>`;
  }
  r.innerHTML = html;
}
function setTab(t){ view.tab=t; view.mode="list"; renderApp(); }
function openRights(){ view.mode="rights"; view.editingUser=null; renderApp(); }
function startAdd(){ view.mode="add"; view.step="subject"; view.draft={subject:"",task:"",deadline:""}; renderApp(); }

// ---------- DATA ----------
async function fetchHomework(archived){
  const { data } = await sb.from("homework").select("*").eq("is_archived", archived).order("deadline",{nullsFirst:false});
  return data || [];
}
async function fetchCompletions(hwIds){
  if(!hwIds.length) return [];
  const { data } = await sb.from("completions").select("homework_id,user_id,profiles(login,display_name)").in("homework_id", hwIds);
  return data || [];
}

async function renderBoard(){
  const b = document.getElementById("board");
  if(view.mode==="rights") return renderRightsBoard(b);
  if(view.mode==="add") return renderAddBoard(b);
  if(!profile.can_view && !profile.is_admin){
    b.innerHTML = `<div class="empty">У вас пока нет прав на просмотр ДЗ.<br>Обратитесь к администратору.</div>`;
    return;
  }
  b.innerHTML = `<div class="empty">Загрузка…</div>`;
  const archived = view.tab==="history";
  const rows = await fetchHomework(archived);
  if(!rows.length){ b.innerHTML = `<div class="empty">${archived?"История пуста":"Домашнего задания нет"}</div>`; return; }
  const comps = await fetchCompletions(rows.map(r=>r.id));
  const bySubject = {};
  rows.forEach(r=>{ (bySubject[r.subject]=bySubject[r.subject]||[]).push(r); });
  let html = "";
  Object.keys(bySubject).forEach(subj=>{
    html += `<h3 style="font-size:14px;margin:16px 0 8px">${esc(subj)}</h3>`;
    bySubject[subj].forEach(t=>{
      const my = comps.filter(c=>c.homework_id===t.id);
      const iDid = my.some(c=>c.user_id===profile.id);
      const names = my.map(c=>esc(c.profiles?.display_name || c.profiles?.login || "?"));
      html += `<div class="card task">
        <div class="row">
          ${!archived ? `<button class="chk ${iDid?'on':''}" onclick="toggleDone('${t.id}',${iDid})"></button>` : ""}
          <div style="flex:1">
            <div>${esc(t.task)}</div>
            <div class="meta">${t.deadline ? "до "+t.deadline : "без срока"} ${my.length?`· <span class="link" onclick="toggleWho('${t.id}')">кто сделал (${my.length})</span>`:''}</div>
            <div id="who-${t.id}" class="who" style="display:none">${names.length?names.join(", "):"Пока никто"}</div>
          </div>
          ${profile.is_admin && !archived ? `<button class="link" onclick="archiveHw('${t.id}')" style="font-size:12px">ДЗ прошло</button>` : ""}
        </div>
      </div>`;
    });
  });
  b.innerHTML = html;
}
function toggleWho(id){ const e=document.getElementById("who-"+id); e.style.display = e.style.display==="none" ? "block" : "none"; }

async function toggleDone(id, was){
  if(was) await sb.from("completions").delete().eq("homework_id", id).eq("user_id", profile.id);
  else await sb.from("completions").insert({ homework_id:id, user_id:profile.id });
  renderBoard();
}
async function archiveHw(id){
  await sb.from("homework").update({ is_archived:true }).eq("id", id);
  toast("Перенесено в историю");
  renderBoard();
}

// ---------- ADD FLOW ----------
function renderAddBoard(b){
  const d = view.draft;
  if(view.step==="subject"){
    b.innerHTML = `<div class="card"><h3>Какой предмет?</h3>
      <input class="f" id="sIn" value="${esc(d.subject)}" placeholder="Например: Математика">
      <button class="btn" onclick="addNext('subject')">Далее</button>
      <button class="btn sec" onclick="cancelAdd()">Отмена</button></div>`;
  } else if(view.step==="task"){
    b.innerHTML = `<div class="card"><h3>Что задано?</h3>
      <input class="f" id="tIn" value="${esc(d.task)}" placeholder="Описание задания">
      <button class="btn" onclick="addNext('task')">Далее</button>
      <button class="btn sec" onclick="view.step='subject';renderApp()">Назад</button></div>`;
  } else if(view.step==="deadline"){
    b.innerHTML = `<div class="card"><h3>Срок сдачи</h3>
      <input class="f" type="date" id="dlIn" value="${esc(d.deadline)}">
      <button class="btn" onclick="addNext('deadline')">Сохранить</button>
      <button class="btn sec" onclick="view.step='task';renderApp()">Назад</button></div>`;
  }
}
function addNext(step){
  if(step==="subject"){ view.draft.subject = document.getElementById("sIn").value.trim(); if(!view.draft.subject) return; view.step="task"; }
  else if(step==="task"){ view.draft.task = document.getElementById("tIn").value.trim(); if(!view.draft.task) return; view.step="deadline"; }
  else if(step==="deadline"){ view.draft.deadline = document.getElementById("dlIn").value || null; saveDraft(); return; }
  renderApp();
}
async function saveDraft(){
  await sb.from("homework").insert({
    subject: view.draft.subject, subject_key: norm(view.draft.subject),
    task: view.draft.task, deadline: view.draft.deadline, created_by: profile.id
  });
  toast("Записано ✓"); view.mode="list"; view.tab="all"; renderApp();
}
function cancelAdd(){ view.mode="list"; renderApp(); }

// ---------- RIGHTS (ADMIN) ----------
async function renderRightsBoard(b){
  if(view.editingUser){ return renderUserEdit(b, view.editingUser); }
  b.innerHTML = `<div class="empty">Загрузка…</div>`;
  const { data } = await sb.from("profiles").select("*").order("login");
  let html = "";
  (data||[]).forEach(u=>{
    html += `<div class="card" style="margin-bottom:8px;cursor:pointer" onclick='openUser(${JSON.stringify(u.id)})'>
      <b>${esc(u.display_name||u.login)}</b> <span style="color:var(--soft);font-size:12px">(${esc(u.login)})</span>
      <div class="meta">${u.is_admin?"👑 админ · ":""}${u.can_view?"просмотр ✓ ":""}${u.can_add?"добавление ✓ ":""}${u.is_blocked?"🚫 заблокирован":""}</div>
    </div>`;
  });
  b.innerHTML = html || `<div class="empty">Пользователей нет</div>`;
  window._users = data || [];
}
function openUser(id){ view.editingUser = id; renderApp(); }
function renderUserEdit(b, id){
  const u = (window._users||[]).find(x=>x.id===id);
  if(!u){ view.editingUser=null; return renderApp(); }
  b.innerHTML = `<div class="card">
    <button class="link" onclick="view.editingUser=null;renderApp()">← Назад к списку</button>
    <h3 style="margin-top:10px">${esc(u.login)}</h3>
    <input class="f" id="dnIn" value="${esc(u.display_name||"")}" placeholder="Отображаемое имя">
    <button class="btn sec" style="width:auto" onclick="saveName('${u.id}')">Сохранить имя</button>
    <div style="margin-top:14px">
      <div class="perm"><span>Просматривать ДЗ</span><div class="sw ${u.can_view?'on':''}" onclick="togglePerm('${u.id}','can_view',${u.can_view})"></div></div>
      <div class="perm"><span>Добавлять ДЗ</span><div class="sw ${u.can_add?'on':''}" onclick="togglePerm('${u.id}','can_add',${u.can_add})"></div></div>
      <div class="perm"><span>Заблокировать</span><div class="sw ${u.is_blocked?'on':''}" onclick="togglePerm('${u.id}','is_blocked',${u.is_blocked})"></div></div>
    </div>
  </div>`;
}
async function togglePerm(id, field, was){
  await sb.from("profiles").update({ [field]: !was }).eq("id", id);
  const { data } = await sb.from("profiles").select("*").order("login");
  window._users = data || [];
  renderApp();
}
async function saveName(id){
  const v = document.getElementById("dnIn").value.trim();
  await sb.from("profiles").update({ display_name: v || null }).eq("id", id);
  toast("Сохранено");
  const { data } = await sb.from("profiles").select("*").order("login");
  window._users = data || [];
}

boot();
</script>
</body>
</html>
