<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Дневник домашних заданий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --paper: #eef0e4;
    --paper-card: #f8f8f1;
    --paper-card-raised: #ffffff;
    --ink: #1e2b26;
    --ink-soft: #56635b;
    --ink-faint: #8b968e;
    --line: #d9dccb;
    --accent: #2f6f62;
    --accent-ink: #ffffff;
    --accent-soft: #dfe9e2;
    --warn: #a8472b;
    --warn-soft: #f3e0d8;
    --gold: #c98a2c;
    --shadow: 0 1px 2px rgba(30, 43, 38, 0.06), 0 8px 20px -12px rgba(30, 43, 38, 0.18);
    --radius: 14px;
    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141d19;
      --paper-card: #1b2622;
      --paper-card-raised: #212e29;
      --ink: #eae7dc;
      --ink-soft: #a9b3ac;
      --ink-faint: #6d7871;
      --line: #2b3833;
      --accent: #6fb39f;
      --accent-ink: #10231d;
      --accent-soft: #223530;
      --warn: #d98363;
      --warn-soft: #3a2620;
      --gold: #e0ab55;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --paper: #141d19;
    --paper-card: #1b2622;
    --paper-card-raised: #212e29;
    --ink: #eae7dc;
    --ink-soft: #a9b3ac;
    --ink-faint: #6d7871;
    --line: #2b3833;
    --accent: #6fb39f;
    --accent-ink: #10231d;
    --accent-soft: #223530;
    --warn: #d98363;
    --warn-soft: #3a2620;
    --gold: #e0ab55;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.5);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    background-attachment: local;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
  }

  a { color: inherit; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  #app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px calc(48px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- HEADER ---------- */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .brand-mark {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 22px;
    box-shadow: var(--shadow);
    transform: rotate(-4deg);
  }

  .brand h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .icon-btn:hover { transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0); }

  .ghost-link-btn {
    font-size: 13.5px;
    color: var(--ink-faint);
    padding: 8px 4px;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .ghost-link-btn:hover { color: var(--warn); border-color: var(--warn); }

  /* ---------- LAYOUT ---------- */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- RAIL / TABS ---------- */
  .rail {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 760px) {
    .rail {
      position: static;
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 4px;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .rail::-webkit-scrollbar { display: none; }
  }

  .rail-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14.5px;
    text-align: left;
    white-space: nowrap;
    color: var(--ink-soft);
    border: 1px solid transparent;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .rail-tab .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--ink-faint);
  }

  .rail-tab .count {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--ink-faint);
    background: var(--paper);
    border-radius: 20px;
    padding: 1px 7px;
  }

  .rail-tab:hover {
    background: var(--paper-card);
  }

  .rail-tab.active {
    background: var(--paper-card-raised);
    border-color: var(--line);
    color: var(--ink);
    font-weight: 600;
    box-shadow: var(--shadow);
  }

  .rail-divider {
    height: 1px;
    background: var(--line);
    margin: 8px 4px;
  }
  @media (max-width: 760px) { .rail-divider { display: none; } }

  .rail-add-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 12px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    box-shadow: var(--shadow);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .rail-add-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .rail-add-btn:active { transform: translateY(0); }

  @media (max-width: 760px) {
    .rail-add-btn { order: -1; }
  }

  /* ---------- BOARD ---------- */
  .board { min-height: 340px; }

  .board-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 10px;
  }

  .board-heading h2 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }

  .board-heading .hint {
    font-size: 13px;
    color: var(--ink-faint);
  }

  .group-label {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin: 22px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-label:first-child { margin-top: 0; }

  .group-label .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
  }

  .cards { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- TASK CARD ---------- */
  .task-card {
    background: var(--paper-card-raised);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 14px 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: var(--shadow);
    animation: cardIn 0.28s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-card.leaving {
    animation: cardOut 0.32s ease forwards;
  }
  @keyframes cardOut {
    to { opacity: 0; transform: translateX(14px) scale(0.98); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
  }

  .task-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check svg { opacity: 0; transition: opacity 0.15s ease; width: 13px; height: 13px; }
  .task-check:hover svg { opacity: 0.4; }

  .task-body { flex: 1; min-width: 0; }

  .task-subject {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 3px;
  }

  .task-text {
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .task-meta {
    margin-top: 7px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--paper);
    color: var(--ink-faint);
  }
  .badge.today { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .badge.soon { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .badge.overdue { background: var(--warn-soft); color: var(--warn); font-weight: 600; }

  /* ---------- EMPTY STATE ---------- */
  .empty-state {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .glyph {
    font-family: var(--font-display);
    font-size: 34px;
    margin-bottom: 10px;
    opacity: 0.7;
  }
  .empty-state h3 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 6px;
    color: var(--ink);
    font-weight: 600;
  }
  .empty-state p { margin: 0 0 18px; font-size: 14px; }

  .primary-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 14.5px;
    padding: 11px 20px;
    border-radius: 10px;
    box-shadow: var(--shadow);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .primary-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .primary-btn:active { transform: translateY(0); }

  /* ---------- STEPPER (add flow) ---------- */
  .stepper {
    background: var(--paper-card-raised);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 26px 22px;
    box-shadow: var(--shadow);
    max-width: 520px;
    animation: cardIn 0.25s ease both;
  }

  .step-progress {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
  }
  .step-progress .seg {
    height: 3px;
    flex: 1;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.2s ease;
  }
  .step-progress .seg.done { background: var(--accent); }

  .step-eyebrow {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }

  .stepper h3 {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .stepper .sub {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }

  .field-input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .field-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea.field-input {
    resize: vertical;
    min-height: 96px;
    line-height: 1.5;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 11px;
  }
  .chip {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }

  .step-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 10px;
  }

  .btn {
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    transition: filter 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  .btn-text { color: var(--ink-faint); font-weight: 500; }
  .btn-text:hover { color: var(--ink); }

  .review-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    background: var(--paper);
    margin-bottom: 6px;
  }
  .review-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .review-row:last-child { border-bottom: none; }
  .review-row .label { font-size: 12.5px; color: var(--ink-faint); min-width: 78px; padding-top: 2px; }
  .review-row .value { font-size: 14.5px; text-align: right; flex: 1; word-break: break-word; white-space: pre-wrap; }
  .review-row button {
    font-size: 12.5px;
    color: var(--accent);
    white-space: nowrap;
    border-bottom: 1px solid transparent;
  }
  .review-row button:hover { border-color: var(--accent); }

  /* ---------- CONFIRM DIALOG ---------- */
  .overlay-bg {
    position: fixed;
    inset: 0;
    background: rgba(20, 27, 24, 0.42);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .overlay-bg.show { opacity: 1; pointer-events: auto; }

  .confirm-box {
    background: var(--paper-card-raised);
    border-radius: 16px;
    padding: 24px;
    max-width: 340px;
    width: 100%;
    box-shadow: var(--shadow);
    transform: translateY(6px) scale(0.98);
    transition: transform 0.18s ease;
  }
  .overlay-bg.show .confirm-box { transform: translateY(0) scale(1); }

  .confirm-box h4 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 8px;
  }
  .confirm-box p { font-size: 14px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.5; }
  .confirm-box .row { display: flex; gap: 10px; justify-content: flex-end; }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- UPDATE: sync, stats, archive ---------- */
  .topbar-actions { flex-wrap: wrap; justify-content: flex-end; }

  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .sync-pill .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-faint);
  }
  .sync-pill.online .pulse { background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  .sync-pill.offline .pulse { background: var(--warn); }
  .sync-pill.local .pulse { background: var(--gold); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
    50% { box-shadow: 0 0 0 5px transparent; }
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--paper-card-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    box-shadow: var(--shadow);
  }
  .stat .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat.accent .num { color: var(--accent); }
  .stat .lbl { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }

  .rail-emoji { width: 8px; display: inline-flex; justify-content: center; font-size: 12px; margin-right: 2px; }

  .badge.done { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* анимация выполнения */
  .task-card.checked .task-check {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    transform: scale(1.08);
  }
  .task-card.checked .task-check svg { opacity: 1; }
  .task-card.checked .task-text { opacity: 0.55; text-decoration: line-through; }
  .task-check { transition: border-color 0.15s ease, background 0.15s ease, transform 0.2s ease; }

  /* карточки архива */
  .task-card.archived { box-shadow: none; background: var(--paper-card); }
  .task-card.archived .task-text {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
  }
  .task-check.filled {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    cursor: default;
  }
  .task-check.filled svg { opacity: 1; }

  .card-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .mini-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    font-size: 15px;
    color: var(--ink-faint);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mini-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .mini-btn.danger:hover { background: var(--warn-soft); color: var(--warn); }

  .field-input[type="datetime-local"] { min-height: 46px; }
  :root[data-theme="dark"] .field-input { color-scheme: dark; }

  @media (max-width: 520px) {
    .stat { padding: 10px 12px; }
    .stat .num { font-size: 22px; }
    .brand h1 { font-size: 21px; }
  }

  /* ---------- UPDATE: photos ---------- */
  .photo-attach { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .attach-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    border: 1.5px dashed var(--ink-faint);
    border-radius: var(--radius);
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .attach-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .attach-btn.full { opacity: 0.5; pointer-events: none; }
  .attach-hint { font-size: 12.5px; color: var(--ink-faint); }

  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .task-body .thumbs { margin: 8px 0 2px; }
  .thumbs.draft { margin-top: 10px; }
  .thumbs:empty { display: none; }
  .thumb {
    position: relative;
    width: 68px; height: 68px;
    padding: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--paper-card);
  }
  button.thumb { cursor: zoom-in; transition: border-color 0.15s ease, transform 0.15s ease; }
  button.thumb:hover { border-color: var(--accent); transform: translateY(-1px); }
  .thumbs.draft .thumb { width: 76px; height: 76px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-x {
    position: absolute; top: 3px; right: 3px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.62);
    color: #fff; font-size: 11px; line-height: 1;
  }

  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10, 10, 10, 0.9);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  .lb-close, .lb-nav {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: #fff; font-size: 20px;
  }
  .lb-close:hover, .lb-nav:hover { background: rgba(255, 255, 255, 0.26); }
  .lb-close { top: 16px; right: 16px; }
  .lb-nav { top: 50%; transform: translateY(-50%); font-size: 30px; line-height: 1; }
  .lb-nav.prev { left: 14px; }
  .lb-nav.next { right: 14px; }
  .lb-count { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">✎</div>
      <div>
        <h1>Дневник домашних заданий</h1>
        <p id="todayDate"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="sync-pill local" id="syncPill" hidden></span>
      <button class="ghost-link-btn" id="clearAllBtn">Очистить архив</button>
      <button class="icon-btn" id="themeToggle" aria-label="Переключить тему" title="Тема">🌙</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main class="board" id="board"></main>
  </div>

</div>

<div class="overlay-bg" id="overlay">
  <div class="confirm-box" id="confirmBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // =========================================================
  // НАСТРОЙКА ОБЩЕЙ БАЗЫ (Firebase Realtime Database)
  // Вставь сюда адрес своей базы, например:
  //   "https://my-diary-default-rtdb.europe-west1.firebasedatabase.app"
  // Пока адрес пустой — сайт работает как раньше, только на этом устройстве.
  // =========================================================
  const DB_URL = "";
  const POLL_MS = 6000; // как часто подтягивать чужие изменения

  const BASE = DB_URL.trim().replace(/\/+$/, "");
  const SHARED = /^https?:\/\//.test(BASE);
  const LOCAL_KEY = "hw-diary-v1";

  const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>`;
  const LOCALE = "ru-RU";

  // Фото хранятся на устройстве (IndexedDB), в самом задании — только их id
  const MAX_PHOTOS = 5;
  const PHOTOS_ENABLED = !SHARED; // в общем режиме фото не синхронизируются, поэтому отключены
  const photoCache = {};          // id -> dataURL
  let idb = null;

  // ---------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------
  const PALETTE = ["#b4552f", "#2f6f62", "#7d63a6", "#c98a2c", "#3f6fa6", "#6e7f4c"];

  function norm(text) {
    return String(text).toLowerCase().replace(/ё/g, "е").trim().replace(/\s+/g, " ");
  }
  function subjectColor(key) {
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    return PALETTE[hash % PALETTE.length];
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  function dayStart(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function dayDiff(ts) {
    return Math.round((dayStart(Date.now()) - dayStart(ts)) / 86400000);
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
  }
  // «сегодня, 14:30» / «вчера, 09:00» / «12 окт, 14:30»
  function fmtWhen(ts) {
    const diff = dayDiff(ts);
    if (diff === 0) return `сегодня, ${fmtTime(ts)}`;
    if (diff === 1) return `вчера, ${fmtTime(ts)}`;
    const date = new Date(ts).toLocaleDateString(LOCALE, { day: "numeric", month: "short" });
    return `${date}, ${fmtTime(ts)}`;
  }
  function fmtFull(ts) {
    return new Date(ts).toLocaleString(LOCALE, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  }
  function dayLabel(ts) {
    const diff = dayDiff(ts);
    if (diff === 0) return "Сегодня";
    if (diff === 1) return "Вчера";
    return new Date(ts).toLocaleDateString(LOCALE, { day: "numeric", month: "long" });
  }
  function toLocalInput(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // ---------------------------------------------------------
  // PHOTOS
  // ---------------------------------------------------------
  function compressImage(file, maxSide = 1280, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }
  function openPhotoDb() {
    return new Promise(res => {
      try {
        const r = indexedDB.open("hw-diary-photos", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  function photoLoadAll() {
    return new Promise(res => {
      if (!idb) return res();
      try {
        const req = idb.transaction("photos").objectStore("photos").getAll();
        req.onsuccess = () => { (req.result || []).forEach(p => { photoCache[p.id] = p.data; }); res(); };
        req.onerror = () => res();
      } catch (e) { res(); }
    });
  }
  function photoPut(id, data) {
    photoCache[id] = data;
    return new Promise(res => {
      if (!idb) return res(false);
      try {
        const tx = idb.transaction("photos", "readwrite");
        tx.objectStore("photos").put({ id, data });
        tx.oncomplete = () => res(true);
        tx.onerror = tx.onabort = () => res(false);
      } catch (e) { res(false); }
    });
  }
  function photoDelete(ids) {
    ids.forEach(id => { delete photoCache[id]; });
    if (!idb || !ids.length) return;
    try {
      const tx = idb.transaction("photos", "readwrite");
      ids.forEach(id => tx.objectStore("photos").delete(id));
    } catch (e) { /* ignore */ }
  }

  // Просмотр фото на весь экран
  function openLightbox(ids, start) {
    let i = start;
    const box = document.createElement("div");
    box.className = "lightbox";
    const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
    const go = d => { i = (i + d + ids.length) % ids.length; draw(); };
    const onKey = e => {
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft" && ids.length > 1) go(-1);
      if (e.key === "ArrowRight" && ids.length > 1) go(1);
    };
    function draw() {
      box.innerHTML = `
        <button class="lb-close" aria-label="Закрыть">✕</button>
        ${ids.length > 1 ? `<button class="lb-nav prev" aria-label="Предыдущее">‹</button><button class="lb-nav next" aria-label="Следующее">›</button><div class="lb-count">${i + 1} / ${ids.length}</div>` : ""}
        <img src="${photoCache[ids[i]] || ""}" alt="Фото к заданию">
      `;
      box.querySelector(".lb-close").onclick = close;
      if (ids.length > 1) {
        box.querySelector(".prev").onclick = () => go(-1);
        box.querySelector(".next").onclick = () => go(1);
      }
    }
    box.addEventListener("click", e => { if (e.target === box) close(); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(box);
    draw();
  }
  function thumbsHtml(t) {
    const ids = (t.photos || []).filter(id => photoCache[id]);
    if (!ids.length) return "";
    return `<div class="thumbs">` + ids.map((id, i) =>
      `<button class="thumb" data-photo="${t.id}" data-idx="${i}" aria-label="Открыть фото"><img src="${photoCache[id]}" alt=""></button>`
    ).join("") + `</div>`;
  }
  function bindThumbs(root) {
    root.querySelectorAll("[data-photo]").forEach(btn => {
      btn.addEventListener("click", () => {
        const t = state.tasks.find(x => x.id === btn.dataset.photo);
        if (!t) return;
        openLightbox(t.photos.filter(id => photoCache[id]), Number(btn.dataset.idx));
      });
    });
  }

  // ---------------------------------------------------------
  // DATA MODEL
  // task = { id, subject, subjectKey, task, assignedAt, createdAt, done, doneAt }
  // ---------------------------------------------------------
  function normalizeTask(t) {
    const subject = String(t.subject || "").slice(0, 60);
    const done = t.done === true;
    return {
      id: String(t.id),
      subject,
      subjectKey: norm(subject),
      task: String(t.task || "").slice(0, 2000),
      photos: Array.isArray(t.photos) ? t.photos.filter(x => typeof x === "string").slice(0, MAX_PHOTOS) : [],
      assignedAt: Number(t.assignedAt) || Number(t.createdAt) || Date.now(),
      createdAt: Number(t.createdAt) || Number(t.assignedAt) || Date.now(),
      done,
      doneAt: done ? (Number(t.doneAt) || Date.now()) : null,
    };
  }
  function isValidTask(t) {
    return t && typeof t.subject === "string" && t.subject.trim() &&
      ((typeof t.task === "string" && t.task.trim()) || (Array.isArray(t.photos) && t.photos.length > 0));
  }
  function serialize(t) {
    const o = {
      id: t.id, subject: t.subject, task: t.task,
      assignedAt: t.assignedAt, createdAt: t.createdAt, done: t.done,
    };
    if (t.done && t.doneAt) o.doneAt = t.doneAt;
    if (t.photos && t.photos.length) o.photos = t.photos;
    return o;
  }
  function sigOf(list) {
    return JSON.stringify(list.slice().sort((a, b) => a.id.localeCompare(b.id)).map(serialize));
  }

  // ---------------------------------------------------------
  // STORAGE: локальный режим
  // ---------------------------------------------------------
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.tasks)) {
          return { tasks: parsed.tasks.filter(isValidTask).map(normalizeTask) };
        }
      }
    } catch (e) { /* ignore */ }
    return { tasks: [] };
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ tasks: state.tasks.map(serialize) })); }
    catch (e) { /* storage unavailable */ }
  }

  // ---------------------------------------------------------
  // STORAGE: общий режим (Firebase Realtime Database через REST)
  // ---------------------------------------------------------
  async function api(method, path, body) {
    const res = await fetch(`${BASE}/${path}.json`, {
      method,
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  let state = SHARED ? { tasks: [] } : loadLocal();
  let loaded = !SHARED;
  let pending = 0; // сколько наших записей сейчас летит на сервер

  function setSync(mode) {
    const el = document.getElementById("syncPill");
    const map = {
      connecting: ["local", "Подключаюсь…"],
      shared: ["online", "Общий доступ"],
      offline: ["offline", "Нет связи"],
      local: ["local", "Только на этом устройстве"],
    };
    const [cls, label] = map[mode];
    el.hidden = (mode === "local");
    el.className = "sync-pill " + cls;
    el.innerHTML = `<span class="pulse"></span>${label}`;
    el.title = mode === "local"
      ? "Общая база не подключена: задания видны только в этом браузере"
      : mode === "offline" ? "Не удаётся связаться с базой. Попробую ещё раз автоматически." : "";
  }

  async function pull() {
    if (!SHARED || pending > 0 || document.hidden) return;
    try {
      const data = await api("GET", "tasks");
      if (pending > 0) return; // во время запроса мы что-то изменили — не затираем
      const list = data
        ? Object.entries(data)
            .filter(([, t]) => isValidTask(t))
            .map(([id, t]) => normalizeTask({ ...t, id }))
        : [];
      setSync("shared");
      const firstLoad = !loaded;
      loaded = true;
      if (firstLoad || sigOf(list) !== sigOf(state.tasks)) {
        state.tasks = list;
        softRefresh();
      }
    } catch (e) {
      setSync("offline");
      if (!loaded) { loaded = true; softRefresh(); }
    }
  }

  async function remote(fn) {
    pending++;
    try {
      await fn();
      setSync("shared");
    } catch (e) {
      setSync("offline");
      showToast("Нет связи — изменение не сохранилось");
    } finally {
      pending--;
      if (pending === 0) { pull(); }
    }
  }

  function addTask(t) {
    state.tasks.push(t);
    if (SHARED) remote(() => api("PUT", `tasks/${t.id}`, serialize(t)));
    else saveLocal();
  }
  function updateTask(id, patch) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    Object.assign(t, patch);
    if (SHARED) remote(() => api("PATCH", `tasks/${id}`, patch)); // null в PATCH удаляет поле
    else saveLocal();
  }
  function deleteTasks(ids) {
    const set = new Set(ids);
    photoDelete(state.tasks.filter(t => set.has(t.id)).flatMap(t => t.photos || []));
    state.tasks = state.tasks.filter(t => !set.has(t.id));
    if (SHARED) {
      const body = {};
      ids.forEach(id => { body[id] = null; });
      remote(() => api("PATCH", "tasks", body));
    } else saveLocal();
  }

  // ---------------------------------------------------------
  // VIEW STATE
  // ---------------------------------------------------------
  const STEP_ORDER = ["subject", "task", "assigned", "review"];

  let view = {
    mode: "list",          // 'list' | 'add'
    tab: "active",         // 'active' | 'archive'
    activeSubject: "all",  // 'all' | subjectKey
    step: "subject",
    draft: { subject: "", task: "", assignedAt: Date.now(), editing: null, photos: [] },
  };

  // ---------------------------------------------------------
  // DERIVED DATA
  // ---------------------------------------------------------
  function activeTasks() { return state.tasks.filter(t => !t.done); }
  function archivedTasks() { return state.tasks.filter(t => t.done); }

  function getSubjects() {
    const map = new Map();
    activeTasks().forEach(t => {
      if (!map.has(t.subjectKey)) map.set(t.subjectKey, { key: t.subjectKey, name: t.subject, count: 0 });
      map.get(t.subjectKey).count++;
    });
    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, "ru"));
  }

  // новые задания сверху
  function tasksFor(subjectKey) {
    return activeTasks()
      .filter(t => subjectKey === "all" || t.subjectKey === subjectKey)
      .sort((a, b) => b.assignedAt - a.assignedAt);
  }

  // ---------------------------------------------------------
  // RENDER: STATS
  // ---------------------------------------------------------
  function renderStats() {
    const el = document.getElementById("stats");
    const todayStart = dayStart(Date.now());
    const todayCount = state.tasks.filter(t => t.assignedAt >= todayStart).length;
    el.innerHTML = `
      <div class="stat accent"><div class="num">${activeTasks().length}</div><div class="lbl">в работе</div></div>
      <div class="stat"><div class="num">${todayCount}</div><div class="lbl">задано сегодня</div></div>
      <div class="stat"><div class="num">${archivedTasks().length}</div><div class="lbl">в архиве</div></div>
    `;
  }

  // ---------------------------------------------------------
  // RENDER: RAIL
  // ---------------------------------------------------------
  function renderRail() {
    const rail = document.getElementById("rail");
    const subjects = getSubjects();
    const total = activeTasks().length;
    const inActive = view.tab === "active";

    let html = `
      <button class="rail-add-btn" id="railAddBtn">
        <span>＋</span><span>Записать ДЗ</span>
      </button>
      <div class="rail-divider"></div>
      <button class="rail-tab ${inActive && view.activeSubject === "all" ? "active" : ""}" data-subject="all">
        <span class="dot" style="background: var(--ink-faint)"></span>
        <span>Все задания</span>
        <span class="count">${total}</span>
      </button>
    `;

    subjects.forEach(s => {
      const active = inActive && view.activeSubject === s.key;
      html += `
        <button class="rail-tab ${active ? "active" : ""}" data-subject="${escapeAttr(s.key)}">
          <span class="dot" style="background:${subjectColor(s.key)}"></span>
          <span>${escapeHtml(s.name)}</span>
          <span class="count">${s.count}</span>
        </button>
      `;
    });

    html += `
      <div class="rail-divider"></div>
      <button class="rail-tab ${view.tab === "archive" ? "active" : ""}" id="archiveTab">
        <span class="rail-emoji">🗂</span>
        <span>Архив</span>
        <span class="count">${archivedTasks().length}</span>
      </button>
    `;

    rail.innerHTML = html;

    rail.querySelectorAll("[data-subject]").forEach(btn => {
      btn.addEventListener("click", () => {
        view.tab = "active";
        view.activeSubject = btn.dataset.subject;
        view.mode = "list";
        render();
      });
    });
    document.getElementById("archiveTab").addEventListener("click", () => {
      view.tab = "archive";
      view.mode = "list";
      render();
    });
    document.getElementById("railAddBtn").addEventListener("click", startAddFlow);
  }

  // ---------------------------------------------------------
  // RENDER: BOARD (список активных)
  // ---------------------------------------------------------
  function loadingHtml() {
    return `<div class="empty-state"><div class="glyph">⏳</div><h3>Загружаю задания…</h3><p>Подтягиваю общий список.</p></div>`;
  }

  function renderBoardList() {
    const board = document.getElementById("board");
    const subjects = getSubjects();

    if (!loaded) { board.innerHTML = loadingHtml(); return; }

    if (subjects.length === 0) {
      const hasArchive = archivedTasks().length > 0;
      board.innerHTML = `
        <div class="empty-state">
          <div class="glyph">${hasArchive ? "🎉" : "📭"}</div>
          <h3>${hasArchive ? "Всё сделано!" : "Домашнего задания нет"}</h3>
          <p>${hasArchive ? "Выполненные задания лежат в архиве." : "Добавь первую запись — займёт меньше минуты."}</p>
          <button class="primary-btn" id="emptyAddBtn">＋ Записать ДЗ</button>
        </div>
      `;
      document.getElementById("emptyAddBtn").addEventListener("click", startAddFlow);
      return;
    }

    if (view.activeSubject === "all") {
      let html = `
        <div class="board-heading">
          <h2>Все домашние задания</h2>
          <span class="hint">${activeTasks().length} шт.</span>
        </div>
      `;
      subjects.forEach(s => {
        html += `<div class="group-label"><span class="dot" style="background:${subjectColor(s.key)}"></span>${escapeHtml(s.name)}</div>`;
        html += `<div class="cards">` + tasksFor(s.key).map(t => taskCardHtml(t)).join("") + `</div>`;
      });
      board.innerHTML = html;
    } else {
      const items = tasksFor(view.activeSubject);
      if (items.length === 0) { view.activeSubject = "all"; return renderBoardList(); }
      board.innerHTML = `
        <div class="board-heading">
          <h2>${escapeHtml(items[0].subject)}</h2>
          <span class="hint">${items.length} шт.</span>
        </div>
        <div class="cards">${items.map(t => taskCardHtml(t)).join("")}</div>
      `;
    }

    board.querySelectorAll("[data-done]").forEach(btn => {
      btn.addEventListener("click", () => completeTask(btn.dataset.done));
    });
    bindThumbs(board);
  }

  function taskCardHtml(t, archived) {
    const color = subjectColor(t.subjectKey);
    const showSubject = archived || view.activeSubject === "all";
    const isNew = !archived && dayDiff(t.assignedAt) === 0;
    return `
      <div class="task-card ${archived ? "archived" : ""}" data-id="${t.id}" style="border-left-color:${color}">
        ${archived
          ? `<div class="task-check filled" aria-hidden="true">${CHECK_SVG}</div>`
          : `<button class="task-check" data-done="${t.id}" aria-label="Отметить выполненным">${CHECK_SVG}</button>`}
        <div class="task-body">
          ${showSubject ? `<div class="task-subject" style="color:${color}">${escapeHtml(t.subject)}</div>` : ""}
          ${t.task ? `<div class="task-text">${escapeHtml(t.task)}</div>` : ""}
          ${thumbsHtml(t)}
          <div class="task-meta">
            <span class="badge ${isNew ? "soon" : ""}">🕒 Задано: ${fmtWhen(t.assignedAt)}</span>
            ${archived && t.doneAt ? `<span class="badge done">✓ Выполнено: ${fmtWhen(t.doneAt)}</span>` : ""}
          </div>
        </div>
        ${archived ? `
          <div class="card-actions">
            <button class="mini-btn" data-restore="${t.id}" title="Вернуть в активные" aria-label="Вернуть в активные">↩</button>
            <button class="mini-btn danger" data-delete="${t.id}" title="Удалить навсегда" aria-label="Удалить навсегда">✕</button>
          </div>` : ""}
      </div>
    `;
  }

  function completeTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t || t.done) return;
    const el = document.querySelector(`.task-card[data-id="${id}"]`);
    const finish = () => {
      updateTask(id, { done: true, doneAt: Date.now() });
      render();
      showToast("Перенесено в архив ✓");
    };
    if (el) {
      el.classList.add("checked");
      setTimeout(() => {
        el.classList.add("leaving");
        setTimeout(finish, 260);
      }, 220);
    } else finish();
  }

  // ---------------------------------------------------------
  // RENDER: BOARD (архив)
  // ---------------------------------------------------------
  function renderBoardArchive() {
    const board = document.getElementById("board");
    if (!loaded) { board.innerHTML = loadingHtml(); return; }

    const items = archivedTasks().sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

    if (items.length === 0) {
      board.innerHTML = `
        <div class="empty-state">
          <div class="glyph">🗂</div>
          <h3>Архив пуст</h3>
          <p>Когда отметишь задание выполненным, оно появится здесь.</p>
        </div>
      `;
      return;
    }

    let html = `
      <div class="board-heading">
        <h2>Архив</h2>
        <span class="hint">${items.length} шт.</span>
      </div>
    `;
    let currentDay = null;
    let open = false;
    items.forEach(t => {
      const day = dayStart(t.doneAt || t.createdAt);
      if (day !== currentDay) {
        if (open) html += `</div>`;
        html += `<div class="group-label">${escapeHtml(dayLabel(day))}</div><div class="cards">`;
        currentDay = day;
        open = true;
      }
      html += taskCardHtml(t, true);
    });
    if (open) html += `</div>`;
    board.innerHTML = html;
    bindThumbs(board);

    board.querySelectorAll("[data-restore]").forEach(btn => {
      btn.addEventListener("click", () => {
        updateTask(btn.dataset.restore, { done: false, doneAt: null });
        render();
        showToast("Вернул в активные ↩");
      });
    });
    board.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.delete;
        openConfirm(
          "Удалить из архива?",
          (SHARED ? "Запись исчезнет у всех без возможности восстановления." : "Запись будет удалена без возможности восстановления."),
          "Удалить",
          () => { deleteTasks([id]); render(); showToast("Запись удалена"); }
        );
      });
    });
  }

  // ---------------------------------------------------------
  // RENDER: BOARD (добавление ДЗ — пошаговая форма)
  // ---------------------------------------------------------
  function startAddFlow() {
    view.mode = "add";
    view.step = "subject";
    view.draft = { subject: "", task: "", assignedAt: Date.now(), editing: null, photos: [] };
    render();
  }

  function cancelAddFlow() {
    view.mode = "list";
    render();
  }

  function progressHtml() {
    const idx = STEP_ORDER.indexOf(view.step);
    return `<div class="step-progress">` +
      STEP_ORDER.map((s, i) => `<div class="seg ${i <= idx ? "done" : ""}"></div>`).join("") +
      `</div>`;
  }

  // после заполнения шага: если правили из «Проверки» — вернуться туда, иначе дальше
  function afterStep() {
    if (view.draft.editing) { view.draft.editing = null; view.step = "review"; }
    else view.step = STEP_ORDER[STEP_ORDER.indexOf(view.step) + 1];
    render();
  }
  function backFrom(prevStep) {
    if (view.draft.editing) { view.draft.editing = null; view.step = "review"; }
    else view.step = prevStep;
    render();
  }

  function renderBoardAdd() {
    const board = document.getElementById("board");
    const subjects = getSubjects();

    if (view.step === "subject") {
      board.innerHTML = `
        <div class="stepper">
          ${progressHtml()}
          <div class="step-eyebrow">Шаг 1 из 3</div>
          <h3>Какой предмет?</h3>
          <p class="sub">Например: Математика, Английский язык</p>
          <input class="field-input" id="subjectInput" placeholder="Название предмета" maxlength="60" value="${escapeAttr(view.draft.subject)}" autofocus>
          ${subjects.length ? `<div class="chip-row">${subjects.map(s => `<button class="chip" data-pick="${escapeAttr(s.name)}">${escapeHtml(s.name)}</button>`).join("")}</div>` : ""}
          <div class="step-actions">
            <button class="btn btn-text" id="cancelBtn">${view.draft.editing ? "Назад" : "Отмена"}</button>
            <button class="btn btn-primary" id="nextBtn">Далее</button>
          </div>
        </div>
      `;
      const input = document.getElementById("subjectInput");
      const nextBtn = document.getElementById("nextBtn");
      const sync = () => { nextBtn.disabled = input.value.trim().length === 0; };
      const commit = () => {
        if (nextBtn.disabled) return;
        view.draft.subject = input.value.trim();
        afterStep();
      };
      input.addEventListener("input", sync);
      sync();
      input.focus();
      input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
      board.querySelectorAll("[data-pick]").forEach(chip => {
        chip.addEventListener("click", () => { input.value = chip.dataset.pick; sync(); input.focus(); });
      });
      nextBtn.addEventListener("click", commit);
      document.getElementById("cancelBtn").addEventListener("click", () => {
        if (view.draft.editing) { view.draft.editing = null; view.step = "review"; render(); }
        else cancelAddFlow();
      });
    }

    if (view.step === "task") {
      board.innerHTML = `
        <div class="stepper">
          ${progressHtml()}
          <div class="step-eyebrow">Шаг 2 из 3 · ${escapeHtml(view.draft.subject)}</div>
          <h3>Что задано?</h3>
          <p class="sub">Например: стр. 45, № 12–15.${PHOTOS_ENABLED ? " Можно добавить фото." : ""}</p>
          <textarea class="field-input" id="taskInput" maxlength="2000" placeholder="Описание задания">${escapeHtml(view.draft.task)}</textarea>
          ${PHOTOS_ENABLED ? `
            <div class="photo-attach">
              <label class="attach-btn" id="attachBtn">
                <input type="file" id="photoInput" accept="image/*" multiple hidden>
                <span>📷 Прикрепить фото</span>
              </label>
              <span class="attach-hint" id="photoHint"></span>
            </div>
            <div class="thumbs draft" id="draftThumbs"></div>` : ""}
          <div class="step-actions">
            <button class="btn btn-text" id="backBtn">Назад</button>
            <button class="btn btn-primary" id="nextBtn">Далее</button>
          </div>
        </div>
      `;
      const input = document.getElementById("taskInput");
      const nextBtn = document.getElementById("nextBtn");
      const sync = () => {
        nextBtn.disabled = input.value.trim().length === 0 && view.draft.photos.length === 0;
      };
      input.addEventListener("input", () => { view.draft.task = input.value; sync(); });

      if (PHOTOS_ENABLED) {
        const thumbsEl = document.getElementById("draftThumbs");
        const hint = document.getElementById("photoHint");
        const attachBtn = document.getElementById("attachBtn");
        const photoInput = document.getElementById("photoInput");
        const paint = () => {
          thumbsEl.innerHTML = view.draft.photos.map((p, i) =>
            `<div class="thumb"><img src="${p.data}" alt=""><button class="thumb-x" data-rm="${i}" aria-label="Убрать фото">✕</button></div>`
          ).join("");
          thumbsEl.querySelectorAll("[data-rm]").forEach(btn => {
            btn.addEventListener("click", () => {
              view.draft.photos.splice(Number(btn.dataset.rm), 1);
              paint(); sync();
            });
          });
          hint.textContent = view.draft.photos.length ? `${view.draft.photos.length} из ${MAX_PHOTOS}` : "";
          attachBtn.classList.toggle("full", view.draft.photos.length >= MAX_PHOTOS);
        };
        photoInput.addEventListener("change", async () => {
          const files = Array.from(photoInput.files);
          photoInput.value = "";
          for (const f of files) {
            if (view.draft.photos.length >= MAX_PHOTOS) { showToast(`Максимум ${MAX_PHOTOS} фото`); break; }
            try {
              const data = await compressImage(f);
              view.draft.photos.push({ id: uid(), data });
              paint(); sync();
            } catch (e) { showToast("Не получилось открыть это фото"); }
          }
        });
        paint();
      }

      sync();
      input.focus();
      nextBtn.addEventListener("click", () => {
        view.draft.task = input.value.trim();
        afterStep();
      });
      document.getElementById("backBtn").addEventListener("click", () => {
        view.draft.task = input.value.trim();
        backFrom("subject");
      });
    }

    if (view.step === "assigned") {
      board.innerHTML = `
        <div class="stepper">
          ${progressHtml()}
          <div class="step-eyebrow">Шаг 3 из 3</div>
          <h3>Когда задали?</h3>
          <p class="sub">Дата и время, когда было задано это ДЗ</p>
          <input class="field-input" type="datetime-local" id="assignedInput" value="${toLocalInput(view.draft.assignedAt)}">
          <div class="chip-row">
            <button class="chip" id="chipNow">Сейчас</button>
            <button class="chip" id="chipYesterday">Вчера в это же время</button>
          </div>
          <div class="step-actions">
            <button class="btn btn-text" id="backBtn">Назад</button>
            <button class="btn btn-primary" id="nextBtn">Далее</button>
          </div>
        </div>
      `;
      const input = document.getElementById("assignedInput");
      document.getElementById("chipNow").addEventListener("click", () => { input.value = toLocalInput(Date.now()); });
      document.getElementById("chipYesterday").addEventListener("click", () => { input.value = toLocalInput(Date.now() - 86400000); });
      document.getElementById("nextBtn").addEventListener("click", () => {
        const ts = input.value ? new Date(input.value).getTime() : Date.now();
        view.draft.assignedAt = isNaN(ts) ? Date.now() : ts;
        afterStep();
      });
      document.getElementById("backBtn").addEventListener("click", () => backFrom("task"));
    }

    if (view.step === "review") {
      board.innerHTML = `
        <div class="stepper">
          ${progressHtml()}
          <div class="step-eyebrow">Проверка</div>
          <h3>Всё верно?</h3>
          <p class="sub">Проверь запись перед сохранением${SHARED ? ". Её увидят все." : "."}</p>
          <div class="review-card">
            <div class="review-row">
              <div class="label">Предмет</div>
              <div class="value">${escapeHtml(view.draft.subject)}</div>
              <button data-edit="subject">Изменить</button>
            </div>
            <div class="review-row">
              <div class="label">Задание</div>
              <div class="value">${view.draft.task ? escapeHtml(view.draft.task) : "—"}</div>
              <button data-edit="task">Изменить</button>
            </div>
            ${view.draft.photos.length ? `
            <div class="review-row">
              <div class="label">Фото</div>
              <div class="value"><div class="thumbs draft">${view.draft.photos.map(p => `<div class="thumb"><img src="${p.data}" alt=""></div>`).join("")}</div></div>
              <button data-edit="task">Изменить</button>
            </div>` : ""}
            <div class="review-row">
              <div class="label">Задано</div>
              <div class="value">${escapeHtml(fmtFull(view.draft.assignedAt))}</div>
              <button data-edit="assigned">Изменить</button>
            </div>
          </div>
          <div class="step-actions">
            <button class="btn btn-text" id="cancelBtn">Отмена</button>
            <button class="btn btn-primary" id="saveBtn">✓ Подтвердить</button>
          </div>
        </div>
      `;
      board.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          view.draft.editing = btn.dataset.edit;
          view.step = btn.dataset.edit;
          render();
        });
      });
      document.getElementById("saveBtn").addEventListener("click", saveDraft);
      document.getElementById("cancelBtn").addEventListener("click", cancelAddFlow);
    }
  }

  function saveDraft() {
    const photos = view.draft.photos.slice();
    const t = normalizeTask({
      id: uid(),
      subject: view.draft.subject,
      task: view.draft.task,
      photos: photos.map(p => p.id),
      assignedAt: view.draft.assignedAt,
      createdAt: Date.now(),
      done: false,
    });
    photos.forEach(p => { photoCache[p.id] = p.data; });
    addTask(t);
    view.mode = "list";
    view.tab = "active";
    view.activeSubject = t.subjectKey;
    render();
    showToast(SHARED ? "Записано — теперь видно всем ✓" : "Записано ✓");
    Promise.all(photos.map(p => photoPut(p.id, p.data))).then(results => {
      if (results.includes(false)) showToast("Фото не сохранились на устройстве и пропадут после перезагрузки");
    });
  }

  // ---------------------------------------------------------
  // TOAST
  // ---------------------------------------------------------
  let toastTimer = null;
  function showToast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  }

  // ---------------------------------------------------------
  // CONFIRM DIALOG
  // ---------------------------------------------------------
  function openConfirm(title, text, confirmLabel, onConfirm) {
    const overlay = document.getElementById("overlay");
    const box = document.getElementById("confirmBox");
    box.innerHTML = `
      <h4>${title}</h4>
      <p>${text}</p>
      <div class="row">
        <button class="btn btn-text" id="confirmCancel">Отмена</button>
        <button class="btn btn-primary" id="confirmOk" style="background:var(--warn)">${confirmLabel}</button>
      </div>
    `;
    overlay.classList.add("show");
    const close = () => overlay.classList.remove("show");
    document.getElementById("confirmCancel").addEventListener("click", close);
    document.getElementById("confirmOk").addEventListener("click", () => { close(); onConfirm(); });
    overlay.onclick = e => { if (e.target === overlay) close(); };
  }

  // «Очистить архив» удаляет только выполненные, активные не трогает
  document.getElementById("clearAllBtn").addEventListener("click", () => {
    const ids = archivedTasks().map(t => t.id);
    if (ids.length === 0) { showToast("Архив уже пуст"); return; }
    openConfirm(
      "Очистить архив?",
      (SHARED ? "Все выполненные задания будут удалены у всех пользователей без возможности восстановления. Активные задания не пострадают." : "Все выполненные задания будут удалены без возможности восстановления. Активные задания не пострадают."),
      "Очистить",
      () => {
        deleteTasks(ids);
        render();
        showToast(`Удалено записей: ${ids.length}`);
      }
    );
  });

  // ---------------------------------------------------------
  // THEME TOGGLE
  // ---------------------------------------------------------
  const themeBtn = document.getElementById("themeToggle");
  function applyTheme(mode) {
    if (mode === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeBtn.textContent = "☀️"; }
    else if (mode === "light") { document.documentElement.setAttribute("data-theme", "light"); themeBtn.textContent = "🌙"; }
    else { document.documentElement.removeAttribute("data-theme"); themeBtn.textContent = "🌓"; }
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem("hw-diary-theme"); } catch (e) {}
  applyTheme(savedTheme);
  themeBtn.addEventListener("click", () => {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const current = document.documentElement.getAttribute("data-theme") || (prefersDark ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("hw-diary-theme", next); } catch (e) {}
  });

  // ---------------------------------------------------------
  // DATE HEADER
  // ---------------------------------------------------------
  document.getElementById("todayDate").textContent =
    new Date().toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long" });

  // ---------------------------------------------------------
  // MAIN RENDER
  // ---------------------------------------------------------
  function render() {
    renderStats();
    renderRail();
    if (view.mode === "add") renderBoardAdd();
    else if (view.tab === "archive") renderBoardArchive();
    else renderBoardList();
  }

  // обновление от синхронизации: не трогаем форму, чтобы не стереть то, что человек печатает
  function softRefresh() {
    if (view.mode === "add") { renderStats(); renderRail(); }
    else render();
  }

  // ---------------------------------------------------------
  // START
  // ---------------------------------------------------------
  setSync(SHARED ? "connecting" : "local");
  render();
  if (PHOTOS_ENABLED) {
    openPhotoDb().then(db => { idb = db; return photoLoadAll(); }).then(() => render());
  }

  if (SHARED) {
    pull();
    setInterval(pull, POLL_MS);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
    window.addEventListener("online", pull);
  }
})();
</script>
</body>
</html>
